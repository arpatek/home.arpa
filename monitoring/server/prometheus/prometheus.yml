global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node'
    static_configs:
      - targets:
          - 'prod-mon-0.home.arpa:9100'
          - 'prod-git-0.home.arpa:9100'
          - 'prod-ipa-0.home.arpa:9100'

  - job_name: 'cadvisor'
    static_configs:
      - targets:
          - 'prod-mon-0.home.arpa:8080'
          - 'prod-git-0.home.arpa:8080'
