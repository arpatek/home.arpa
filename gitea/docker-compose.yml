services:
  db:
    image: postgres:16.13
    container_name: gitea-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: gitea
    volumes:
      - /opt/gitea/postgres:/var/lib/postgresql/data
    networks:
      - gitea-net

  gitea:
    image: gitea/gitea:1.26.1
    container_name: gitea
    restart: unless-stopped
    environment:
      - USER_UID=999
      - USER_GID=988
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=db:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
    volumes:
      - /opt/gitea/data:/data
      - /opt/gitea/config:/etc/gitea
    ports:
      - "3000:3000"
      - "2222:22"
    depends_on:
      - db
    networks:
      - gitea-net

  runner:
    image: gitea/runner:0.6.1
    container_name: gitea-runner
    restart: unless-stopped
    depends_on:
      - gitea
    environment:
      - GITEA_INSTANCE_URL=http://prod-git-0.home.arpa:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_TOKEN}
      - GITEA_RUNNER_NAME=prod-git-0-runner
      - GITEA__server__ROOT_URL=http://prod-git-0.home.arpa:3000
      - GITEA__server__LOCAL_ROOT_URL=http://prod-git-0.home.arpa:3000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/gitea/runner:/data
    networks:
      - gitea-net

networks:
  gitea-net:
    driver: bridge
